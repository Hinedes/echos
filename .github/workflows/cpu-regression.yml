name: CPU regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Compile every Python source file
        run: python -m compileall -q .
      - name: Run CPU regression tests
        run: >-
          python -m unittest -v
          test_echos_core.py
          test_echos_frontier_logic.py
          test_echos_flight_metrics.py
